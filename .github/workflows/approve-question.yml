name: Approve question from discussion

on:
  discussion:
    types: [labeled]

permissions:
  contents: write
  discussions: write
  pull-requests: write

jobs:
  create-question-pr:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate question file
        id: generate
        env:
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
        run: node .github/scripts/discussion-to-question.mjs

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Add question from discussion #${{ github.event.discussion.number }}
          title: Add question from discussion #${{ github.event.discussion.number }}
          body: |
            Auto-generated from discussion #${{ github.event.discussion.number }}.

            File: `${{ steps.generate.outputs.file_path }}`

            After merge, comment on the discussion and close it.
          branch: question/discussion-${{ github.event.discussion.number }}
          delete-branch: true

      - name: Comment on discussion
        if: steps.pr.outputs.pull-request-number
        uses: actions/github-script@v8
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        with:
          script: |
            const prUrl = process.env.PR_URL
            const body = `✅ Approved and converted to a PR: ${prUrl}\n\nMerge the PR to add this question to the quiz.`

            await github.graphql(
              `mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                  comment { url }
                }
              }`,
              {
                discussionId: context.payload.discussion.node_id,
                body,
              }
            )

  notify-validation-error:
    needs: create-question-pr
    if: failure() && github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Comment validation error
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `❌ Failed to generate question file from this discussion.\n\nCheck the workflow logs: ${runUrl}`

            await github.graphql(
              `mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                  comment { url }
                }
              }`,
              {
                discussionId: context.payload.discussion.node_id,
                body,
              }
            )
